# Weekly CANN master image build for the supported Ubuntu/openEuler releases.
# Publishes rolling weekly tags only, e.g. cann:master-910b-ubuntu22.04
#
# Uses GitHub-hosted runners (amd64 + arm64). ARM labels require a public repository.
#
# Repository variables: IMAGE_REGISTRY, IMAGE_NAMESPACE
# Repository secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD

name: cann-master-weekly

on:
  schedule:
    # Tuesday 15:00 Asia/Shanghai (UTC+8) = Tuesday 07:00 UTC
    - cron: "0 7 * * 2"
  workflow_dispatch:

concurrency:
  group: cann-master-weekly
  cancel-in-progress: false

env:
  CANN_MASTER_INDEX: https://ascend.devcloud.huaweicloud.com/artifactory/cann-run-mirror/software/master
  CANN_CHIP: 910b
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch_tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu22.04, ubuntu24.04, openeuler22.03, openeuler24.03]
        arch_tag: [amd64, arm64]
        include:
          - arch_tag: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cann_arch: x86_64
          - arch_tag: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cann_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        env:
          OS_TAG: ${{ matrix.os }}
          PLATFORM: ${{ matrix.platform }}
          CANN_ARCH: ${{ matrix.cann_arch }}
          ARCH_TAG: ${{ matrix.arch_tag }}
        run: |
          set -euo pipefail
          BUILD_DIR=$(curl -fsSL "${CANN_MASTER_INDEX}/" | grep -oE '[0-9]{14,}' | head -1)
          PACKAGES=$(curl -fsSL "${CANN_MASTER_INDEX}/${BUILD_DIR}/" | grep -oE 'Ascend-cann-[^"<]+\.run' | sort -u)
          TOOLKIT_URL="${CANN_MASTER_INDEX}/${BUILD_DIR}/$(echo "$PACKAGES" | grep Ascend-cann-toolkit | grep "$CANN_ARCH")"
          OPS_URL="${CANN_MASTER_INDEX}/${BUILD_DIR}/$(echo "$PACKAGES" | grep "Ascend-cann-${CANN_CHIP}-ops" | grep "$CANN_ARCH")"
          IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/cann:master-${CANN_CHIP}-${OS_TAG}-${ARCH_TAG}"

          docker build \
            --platform "$PLATFORM" \
            -f "cann/master/${OS_TAG}/Dockerfile" \
            --build-arg "CANN_TOOLKIT_URL=${TOOLKIT_URL}" \
            --build-arg "CANN_OPS_URL=${OPS_URL}" \
            -t "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"

  manifest:
    name: publish-manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create multi-arch weekly manifests
        run: |
          set -euo pipefail

          for OS_TAG in ubuntu22.04 ubuntu24.04 openeuler22.03 openeuler24.03; do
            IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/cann:master-${CANN_CHIP}-${OS_TAG}"

            docker buildx imagetools create \
              -t "$IMAGE_TAG" \
              "${IMAGE_TAG}-amd64" \
              "${IMAGE_TAG}-arm64"

            echo "Published ${IMAGE_TAG}"
          done
