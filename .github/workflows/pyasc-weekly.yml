# Weekly PyASC image build on published LLVM 19.1.7 bases.
# Publishes four rolling per-arch tags plus two multi-arch tags:
#   pyasc:master-910b-llvm19.1.7-ubuntu24.04-amd64
#   pyasc:master-910b-llvm19.1.7-ubuntu24.04-arm64
#   pyasc:master-910b-llvm19.1.7-openeuler24.03-amd64
#   pyasc:master-910b-llvm19.1.7-openeuler24.03-arm64
#   pyasc:master-910b-llvm19.1.7-ubuntu24.04
#   pyasc:master-910b-llvm19.1.7-openeuler24.03
#
# Uses GitHub-hosted runners (amd64 + arm64). ARM labels require a public repository.
#
# Repository variables: IMAGE_REGISTRY, IMAGE_NAMESPACE
# Repository secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD

name: pyasc-weekly

on:
  schedule:
    # Tuesday 16:00 Asia/Shanghai (UTC+8) = Tuesday 08:00 UTC
    # One hour after cann-master-weekly so runners do not overlap.
    - cron: "0 8 * * 2"
  workflow_dispatch:

concurrency:
  group: pyasc-weekly
  cancel-in-progress: false

env:
  CANN_MASTER_INDEX: https://ascend.devcloud.huaweicloud.com/artifactory/cann-run-mirror/software/master
  CANN_CHIP: 910b
  LLVM_TAG: 19.1.7
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch_tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu24.04, openeuler24.03]
        arch_tag: [amd64, arm64]
        include:
          - arch_tag: amd64
            runner: ubuntu-latest
            platform: linux/amd64
            cann_arch: x86_64
          - arch_tag: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            cann_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        env:
          OS_TAG: ${{ matrix.os }}
          PLATFORM: ${{ matrix.platform }}
          CANN_ARCH: ${{ matrix.cann_arch }}
          ARCH_TAG: ${{ matrix.arch_tag }}
        run: |
          set -euo pipefail
          BUILD_DIR=$(curl -fsSL "${CANN_MASTER_INDEX}/" | grep -oE '[0-9]{14,}' | sort -nr | head -1)
          PACKAGES=$(curl -fsSL "${CANN_MASTER_INDEX}/${BUILD_DIR}/" | grep -oE 'Ascend-cann-[^"<]+\.run' | sort -u)
          TOOLKIT_URL="${CANN_MASTER_INDEX}/${BUILD_DIR}/$(echo "$PACKAGES" | grep Ascend-cann-toolkit | grep "$CANN_ARCH")"
          OPS_URL="${CANN_MASTER_INDEX}/${BUILD_DIR}/$(echo "$PACKAGES" | grep "Ascend-cann-${CANN_CHIP}-ops" | grep "$CANN_ARCH")"
          LLVM_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/llvm:${LLVM_TAG}-${OS_TAG}"
          IMAGE_TAG="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/pyasc:master-${CANN_CHIP}-llvm${LLVM_TAG}-${OS_TAG}-${ARCH_TAG}"

          if [[ -z "$BUILD_DIR" || "$TOOLKIT_URL" != https://* || "$OPS_URL" != https://* ]]; then
            echo "Failed to resolve CANN master packages for ${CANN_ARCH}" >&2
            exit 1
          fi

          echo "LLVM_IMAGE=${LLVM_IMAGE}"
          echo "TOOLKIT_URL=${TOOLKIT_URL}"
          echo "OPS_URL=${OPS_URL}"
          echo "IMAGE_TAG=${IMAGE_TAG}"

          docker build \
            --platform "$PLATFORM" \
            -f pyasc/Dockerfile \
            --build-arg "LLVM_IMAGE=${LLVM_IMAGE}" \
            --build-arg "CANN_TOOLKIT_URL=${TOOLKIT_URL}" \
            --build-arg "CANN_OPS_URL=${OPS_URL}" \
            -t "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"

  manifest:
    name: publish-manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          IMAGE_REPO="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/pyasc"

          for OS_TAG in ubuntu24.04 openeuler24.03; do
            IMAGE_TAG="${IMAGE_REPO}:master-${CANN_CHIP}-llvm${LLVM_TAG}-${OS_TAG}"
            docker buildx imagetools create \
              -t "$IMAGE_TAG" \
              "${IMAGE_TAG}-amd64" \
              "${IMAGE_TAG}-arm64"
            docker buildx imagetools inspect "$IMAGE_TAG"
            echo "Published ${IMAGE_TAG}"
          done
