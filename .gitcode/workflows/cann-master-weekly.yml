# Weekly CANN master image build for Ubuntu 22.04 and openEuler 22.03.
# Publishes rolling weekly tags only, e.g. cann:master-910b-ubuntu22.04
#
# Variables: IMAGE_REGISTRY, IMAGE_NAMESPACE
# Secrets:   REGISTRY_USERNAME, REGISTRY_PASSWORD

name: cann-master-weekly

on:
  schedule:
    # Tuesday 01:00 Asia/Shanghai (UTC+8) = Monday 17:00 UTC
    - cron: "0 17 * * 1"
  workflow_dispatch:
    inputs:
      build_id:
        description: "Optional master build id (empty = latest)"
        required: false
        default: ""
        type: string

env:
  CANN_MASTER_INDEX: https://ascend.devcloud.huaweicloud.com/artifactory/cann-run-mirror/software/master
  CANN_CHIP: 910b
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  resolve:
    name: resolve-latest-master
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Resolve package metadata
        id: meta
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail

          if [ -z "${IMAGE_REGISTRY:-}" ] || [ -z "${IMAGE_NAMESPACE:-}" ]; then
            echo "IMAGE_REGISTRY and IMAGE_NAMESPACE must be set as repository variables" >&2
            exit 1
          fi

          INDEX_HTML="$(mktemp)"
          BUILD_HTML="$(mktemp)"
          trap 'rm -f "$INDEX_HTML" "$BUILD_HTML"' EXIT

          curl -fsSL "${CANN_MASTER_INDEX}/" -o "$INDEX_HTML"

          if [ -n "${INPUT_BUILD_ID:-}" ]; then
            BUILD_ID="$INPUT_BUILD_ID"
          else
            # href="20260730143326087/"  ->  20260730143326087
            BUILD_ID="$(
              grep -oE 'href="[0-9]+/"' "$INDEX_HTML" \
                | sed -E 's/^href="([0-9]+)\/"$/\1/' \
                | sort -n \
                | tail -n 1
            )"
          fi

          if [ -z "$BUILD_ID" ]; then
            echo "Failed to resolve master build id" >&2
            exit 1
          fi

          curl -fsSL "${CANN_MASTER_INDEX}/${BUILD_ID}/" -o "$BUILD_HTML"

          TOOLKIT_FILE="$(
            grep -oE 'Ascend-cann-toolkit_[^"<> ]+_linux-aarch64\.run' "$BUILD_HTML" \
              | head -n 1 || true
          )"
          if [ -z "$TOOLKIT_FILE" ]; then
            echo "Toolkit package not found under ${BUILD_ID}" >&2
            exit 1
          fi

          # Ascend-cann-toolkit_9.2.0~weekly.20260730.01_linux-aarch64.run
          # -> 9.2.0~weekly.20260730.01
          CANN_VERSION="${TOOLKIT_FILE#Ascend-cann-toolkit_}"
          CANN_VERSION="${CANN_VERSION%_linux-aarch64.run}"

          if [ -z "$CANN_VERSION" ] || [ "$CANN_VERSION" = "$TOOLKIT_FILE" ]; then
            echo "Failed to parse CANN version from: ${TOOLKIT_FILE}" >&2
            exit 1
          fi

          OPS_FILE="Ascend-cann-${CANN_CHIP}-ops_${CANN_VERSION}_linux-aarch64.run"
          if ! grep -qF "$OPS_FILE" "$BUILD_HTML"; then
            echo "Ops package not found: $OPS_FILE" >&2
            exit 1
          fi

          {
            echo "build_id=${BUILD_ID}"
            echo "cann_version=${CANN_VERSION}"
            echo "image_repo=${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/cann"
          } >> "$ATOMGIT_OUTPUT"

          echo "Resolved build_id=${BUILD_ID} version=${CANN_VERSION}"

  build:
    name: build-${{ matrix.os }}-${{ matrix.arch_tag }}
    needs: resolve
    runs-on: [ubuntu-latest, ${{ matrix.runner_arch }}, medium]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu22.04
            dockerfile: cann/master/ubuntu22.04/Dockerfile
            runner_arch: x64
            platform: linux/amd64
            cann_arch: x86_64
            arch_tag: amd64
          - os: ubuntu22.04
            dockerfile: cann/master/ubuntu22.04/Dockerfile
            runner_arch: arm64
            platform: linux/arm64
            cann_arch: aarch64
            arch_tag: arm64
          - os: openeuler22.03
            dockerfile: cann/master/openeuler22.03/Dockerfile
            runner_arch: x64
            platform: linux/amd64
            cann_arch: x86_64
            arch_tag: amd64
          - os: openeuler22.03
            dockerfile: cann/master/openeuler22.03/Dockerfile
            runner_arch: arm64
            platform: linux/arm64
            cann_arch: aarch64
            arch_tag: arm64
    steps:
      - uses: checkout

      - name: Login
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PASSWORD" | docker login "$IMAGE_REGISTRY" \
            -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push
        env:
          BUILD_ID: ${{ jobs.resolve.outputs.build_id }}
          CANN_VERSION: ${{ jobs.resolve.outputs.cann_version }}
          IMAGE_REPO: ${{ jobs.resolve.outputs.image_repo }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OS_TAG: ${{ matrix.os }}
          PLATFORM: ${{ matrix.platform }}
          CANN_ARCH: ${{ matrix.cann_arch }}
          ARCH_TAG: ${{ matrix.arch_tag }}
        run: |
          set -euo pipefail

          TOOLKIT_URL="${CANN_MASTER_INDEX}/${BUILD_ID}/Ascend-cann-toolkit_${CANN_VERSION}_linux-${CANN_ARCH}.run"
          OPS_URL="${CANN_MASTER_INDEX}/${BUILD_ID}/Ascend-cann-${CANN_CHIP}-ops_${CANN_VERSION}_linux-${CANN_ARCH}.run"
          IMAGE_TAG="${IMAGE_REPO}:master-${CANN_CHIP}-${OS_TAG}-${ARCH_TAG}"

          echo "toolkit=${TOOLKIT_URL}"
          echo "ops=${OPS_URL}"
          echo "image=${IMAGE_TAG}"

          docker build \
            --platform "$PLATFORM" \
            -f "$DOCKERFILE" \
            --build-arg "CANN_TOOLKIT_URL=${TOOLKIT_URL}" \
            --build-arg "CANN_OPS_URL=${OPS_URL}" \
            -t "$IMAGE_TAG" \
            .

          docker push "$IMAGE_TAG"

  manifest:
    name: publish-manifest
    needs: [resolve, build]
    runs-on: [ubuntu-latest, x64, small]
    strategy:
      matrix:
        os: [ubuntu22.04, openeuler22.03]
    steps:
      - name: Login
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PASSWORD" | docker login "$IMAGE_REGISTRY" \
            -u "$REGISTRY_USERNAME" --password-stdin

      - name: Create multi-arch weekly manifest
        env:
          IMAGE_REPO: ${{ jobs.resolve.outputs.image_repo }}
          OS_TAG: ${{ matrix.os }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_REPO}:master-${CANN_CHIP}-${OS_TAG}"

          docker buildx imagetools create \
            -t "$IMAGE_TAG" \
            "${IMAGE_TAG}-amd64" \
            "${IMAGE_TAG}-arm64"

          echo "Published ${IMAGE_TAG}"
