site_name: Ascend Container Images
site_description: Dockerfiles for Huawei Ascend CANN, LLVM/MLIR, MindSpore, PyASC, veRL, and asnumpy.
site_url: https://docker.infrae.top/
repo_name: wuzhenqing/dockerfile
repo_url: https://github.com/wuzhenqing/dockerfile

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wuzhenqing/dockerfile

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - asnumpy: projects/asnumpy.md
      - cann: projects/cann.md
      - llvm: projects/llvm.md
      - mindspore: projects/mindspore.md
      - pyasc: projects/pyasc.md
      - verl: projects/verl.md
  - Naming Conventions: naming-conventions.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - tables
  - attr_list
  - md_in_html
